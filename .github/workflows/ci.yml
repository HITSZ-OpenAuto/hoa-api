name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff 检查
        run: ruff check src tests

      - name: 单元测试
        run: pytest -q

      - name: 校验工作流内嵌 Python
        run: python scripts/check_workflow_python.py

      - name: 导出 OpenAPI 契约
        run: |
          pip install pyyaml
          python scripts/export_openapi.py

      - name: 校验契约未漂移
        run: |
          if ! git diff --quiet -- docs/openapi.yaml; then
            echo "::error::docs/openapi.yaml 与实现不一致，请运行 python scripts/export_openapi.py 后提交"
            git diff -- docs/openapi.yaml
            exit 1
          fi

  smoke:
    name: 端到端冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 生成种子库并启动服务
        run: |
          python scripts/seed_db.py --out /tmp/hoa-seed.db
          HOA_DB_PATH=/tmp/hoa-seed.db HOA_PORT=18099 \
            nohup hoa-api serve --no-sync > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/v1/meta >/dev/null 2>&1; then
              echo "服务已就绪"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18099/api/v1/meta > /dev/null

      - name: 冒烟测试（REST + MCP + 兼容层）
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:18099 --expect-data

      - name: 服务日志
        if: failure()
        run: cat /tmp/serve.log

  image:
    name: 构建镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4.2.0

      - name: 构建镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: hoa-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: |
          docker run -d --name hoa-api-ci -p 18099:8099 hoa-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/v1/meta > /tmp/meta.json; then
              echo "meta: $(cat /tmp/meta.json)"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18099/api/v1/meta > /dev/null
          docker rm -f hoa-api-ci
