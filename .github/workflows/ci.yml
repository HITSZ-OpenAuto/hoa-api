name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff 检查
        run: ruff check src tests

      - name: 单元测试
        run: pytest -q

      - name: 导出 OpenAPI 契约
        run: |
          pip install pyyaml
          python scripts/export_openapi.py

      - name: 校验契约未漂移
        run: |
          if ! git diff --quiet -- docs/openapi.yaml; then
            echo "::error::docs/openapi.yaml 与实现不一致，请运行 python scripts/export_openapi.py 后提交"
            git diff -- docs/openapi.yaml
            exit 1
          fi
