name: Deploy HOA API

# 可复用工作流：由 HITSZ-OpenAuto/hoa-fuma 的部署流程调用，
# 复用该仓库的 VPS / Tailscale / Cloudflare 凭据把 hoa-api 部署到官方 VPS。
on:
  workflow_call:
    inputs:
      vps_host:
        description: 官方 VPS 的 Tailscale 地址
        required: true
        type: string
      vps_user:
        required: true
        type: string
      vps_port:
        required: true
        type: string
      vps_app_port:
        description: 宿主机上暴露给反向代理的端口
        required: true
        type: string
      cloudflare_zone_id:
        required: true
        type: string
      api_domain:
        description: 对外域名
        required: false
        type: string
        default: api.hoa.moe
      origin_domain:
        description: 用于推导源站 IP 的站点域名
        required: false
        type: string
        default: hoa.moe
      container_name:
        required: false
        type: string
        default: hoa-api
      source_repo:
        description: 待构建的源码仓库（可复用工作流中 github 上下文指向调用方，需显式指定）
        required: false
        type: string
        default: HITSZ-OpenAuto/hoa-api
  workflow_dispatch:
    inputs:
      vps_host:
        required: true
        type: string
      vps_user:
        required: true
        type: string
      vps_port:
        required: true
        type: string
      vps_app_port:
        required: true
        type: string
      cloudflare_zone_id:
        required: true
        type: string
      api_domain:
        required: false
        type: string
        default: api.hoa.moe
      origin_domain:
        required: false
        type: string
        default: hoa.moe
      container_name:
        required: false
        type: string
        default: hoa-api
      source_repo:
        required: false
        type: string
        default: HITSZ-OpenAuto/hoa-api

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hoa-api

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      # 可复用工作流里 github 上下文指向调用方仓库，必须显式指定要构建的源码仓库
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repo }}
          ref: main

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}-${{ github.run_attempt }}

      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  probe:
    name: 探测 VPS 环境
    runs-on: ubuntu-latest
    outputs:
      origin_ip: ${{ steps.probe.outputs.origin_ip }}
    steps:
      - name: 加入组织 Tailscale 网络
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: 读取源站 IP 与容器信息
        id: probe
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ inputs.vps_host }}
          username: ${{ inputs.vps_user }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ inputs.vps_port }}
          script: |
            set -euo pipefail
            echo "容器列表:"
            docker ps --format '  {{.Names}}  {{.Status}}'
            echo "网络列表:"
            docker network ls --format '  {{.Name}}'
            ORIGIN_IP="$(curl -fsS --max-time 10 https://api.ipify.org || true)"
            echo "源站公网 IP: ${ORIGIN_IP}"
            echo "origin_ip=${ORIGIN_IP}" >> "$GITHUB_OUTPUT"

  dns:
    name: 配置 Cloudflare DNS
    needs: probe
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: 写入 api 子域解析
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ inputs.cloudflare_zone_id }}
          API_DOMAIN: ${{ inputs.api_domain }}
          ORIGIN_IP: ${{ needs.probe.outputs.origin_ip }}
        run: |
          set -uo pipefail
          if [ -z "${CF_TOKEN}" ]; then
            echo "::notice::未提供 CLOUDFLARE_API_TOKEN，跳过自动写入 DNS"
            exit 0
          fi
          if [ -z "${ORIGIN_IP}" ]; then
            echo "::notice::未能获取源站 IP，跳过自动写入 DNS"
            exit 0
          fi

          api() {
            curl -sS -H "Authorization: Bearer ${CF_TOKEN}" \
                 -H "Content-Type: application/json" "$@"
          }

          EXISTING="$(api "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${API_DOMAIN}" \
            | python3 -c '
          import json,sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              print(""); raise SystemExit
          for r in d.get("result", []) or []:
              if r.get("type") == "A": print(r["id"]); break
          ')"
          if [ -z "${EXISTING}" ]; then
            RESP="$(api -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -d "{\"type\":\"A\",\"name\":\"${API_DOMAIN}\",\"content\":\"${ORIGIN_IP}\",\"proxied\":true,\"ttl\":1}")"
          else
            RESP="$(api -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${EXISTING}" \
              -d "{\"type\":\"A\",\"name\":\"${API_DOMAIN}\",\"content\":\"${ORIGIN_IP}\",\"proxied\":true,\"ttl\":1}")"
          fi
          echo "${RESP}" | python3 -c '
          import json,sys
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
          except Exception:
              print("::notice::Cloudflare 响应无法解析:", raw[:300]); raise SystemExit
          if d.get("success"):
              print("::notice::DNS 记录写入成功")
          else:
              errs = d.get("errors") or []
              print("::notice::Cloudflare 无 DNS 权限或写入失败:", errs)
          '

  deploy:
    name: 部署到官方 VPS
    needs: [build, probe]
    runs-on: ubuntu-latest
    steps:
      - name: 加入组织 Tailscale 网络
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: 拉取镜像并启动容器
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_TOKEN_FOR_SYNC: ${{ secrets.FUMA_GITHUB_API_TOKEN }}
        with:
          host: ${{ inputs.vps_host }}
          username: ${{ inputs.vps_user }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ inputs.vps_port }}
          envs: GHCR_TOKEN,GITHUB_TOKEN_FOR_SYNC
          script: |
            set -euo pipefail
            image_ref='${{ needs.build.outputs.image_ref }}'
            container='${{ inputs.container_name }}'
            domain='${{ inputs.api_domain }}'
            app_port='${{ inputs.vps_app_port }}'

            # 以正在运行的 hoa-fuma 容器为模板，复制它的 Traefik 标签与网络，
            # 保证与站点使用同一套入口、证书解析器与路由配置
            TEMPLATE_CONTAINER='hoa-fuma'
            if ! docker inspect "${TEMPLATE_CONTAINER}" >/dev/null 2>&1; then
              echo "::error::找不到模板容器 ${TEMPLATE_CONTAINER}"
              exit 1
            fi

            NETWORKS="$(docker inspect "${TEMPLATE_CONTAINER}" \
              --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}')"
            echo "模板容器所在网络: ${NETWORKS}"
            FIRST_NET="$(echo "${NETWORKS}" | awk '{print $1}')"
            if [ -z "${FIRST_NET}" ]; then
              echo "::error::无法确定容器网络"
              exit 1
            fi

            echo "=== 生成 Traefik 标签 ==="
            docker inspect "${TEMPLATE_CONTAINER}" --format '{{json .Config.Labels}}' > /tmp/labels.json
            python3 - "$container" "$domain" <<'PYEOF' > /tmp/labels.env
            import json, re, sys

            container, domain = sys.argv[1], sys.argv[2]
            labels = json.load(open("/tmp/labels.json"))
            traefik = {k: v for k, v in labels.items() if k.startswith("traefik.")}

            def rename(key: str) -> str:
                return re.sub(
                    r"(traefik\.http\.(?:routers|services|middlewares)\.)[^.]+(\.)",
                    rf"\g<1>{container}\g<2>",
                    key,
                )

            renamed = {rename(k): v for k, v in traefik.items()}

            for key in list(renamed):
                if key.endswith(".rule"):
                    renamed[key] = f"Host(`{domain}`)"

            renamed[f"traefik.http.services.{container}.loadbalancer.server.port"] = "8099"
            renamed["traefik.enable"] = "true"

            for key, value in sorted(renamed.items()):
                safe = str(value).replace("'", "'\"'\"'")
                print(f"LABEL {key}='{safe}'")
            PYEOF

            echo "=== 拉取镜像 ==="
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull "${image_ref}"

            echo "=== 启动容器 ==="
            docker volume create hoa-api-data >/dev/null
            docker rm -f "${container}" 2>/dev/null || true

            LABEL_ARGS=()
            while IFS= read -r line; do
              [ -n "${line}" ] && LABEL_ARGS+=("${line#LABEL }")
            done < /tmp/labels.env
            printf '  标签数: %s\n' "${#LABEL_ARGS[@]}"

            docker run -d \
              --name "${container}" \
              --network "${FIRST_NET}" \
              --restart unless-stopped \
              -p "${app_port}:8099" \
              -v hoa-api-data:/app/data \
              -e GITHUB_TOKEN="${GITHUB_TOKEN_FOR_SYNC}" \
              -e HOA_DB_PATH=/app/data/hoa.db \
              -e HOA_SITE_ORIGIN=https://hoa.moe \
              -e HOA_SYNC_INTERVAL_SEC=21600 \
              -e HOA_RATE_LIMIT_PER_MIN=120 \
              -e HOA_MCP_ALLOWED_HOSTS="localhost,127.0.0.1,[::1],${domain}" \
              "${LABEL_ARGS[@]}" \
              "${image_ref}"

            echo "=== 健康检查 ==="
            for _ in $(seq 1 30); do
              if docker exec "${container}" python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/api/v1/meta', timeout=4).status==200 else 1)"; then
                echo "  容器健康"
                break
              fi
              sleep 2
            done
            docker ps --filter "name=${container}" --format '  {{.Names}} {{.Status}} {{.Ports}}'
            docker logs --tail 30 "${container}" 2>&1 | sed 's/^/  /' || true

  verify:
    name: 外网验证
    needs: [deploy, dns]
    runs-on: ubuntu-latest
    steps:
      - name: 轮询公开地址
        env:
          DOMAIN: ${{ inputs.api_domain }}
        run: |
          set -uo pipefail
          for i in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${DOMAIN}/api/v1/meta" || true)"
            echo "  第 ${i} 次: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              echo "::notice::公开地址已就绪 https://${DOMAIN}/api/v1"
              exit 0
            fi
            sleep 10
          done
          echo "::error::公开地址未在预期时间内就绪；若 DNS 记录尚未添加，请在 Cloudflare 添加后重跑本工作流"
          exit 1
