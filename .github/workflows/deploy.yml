name: Deploy HOA API

# 可复用工作流：由 HITSZ-OpenAuto/hoa-fuma 的部署流程调用，
# 复用该仓库的 VPS / Tailscale / Cloudflare 凭据把 hoa-api 部署到官方 VPS。
on:
  workflow_call:
    inputs:
      vps_host:
        description: 官方 VPS 的 Tailscale 地址
        required: true
        type: string
      vps_user:
        required: true
        type: string
      vps_port:
        required: true
        type: string
      vps_app_port:
        description: 宿主机上暴露给反向代理的端口
        required: true
        type: string
      cloudflare_zone_id:
        required: true
        type: string
      api_domain:
        description: 对外域名
        required: false
        type: string
        default: api.hoa.moe
      origin_domain:
        description: 用于推导源站 IP 的站点域名
        required: false
        type: string
        default: hoa.moe
      container_name:
        required: false
        type: string
        default: hoa-api
  workflow_dispatch:
    inputs:
      vps_host:
        required: true
        type: string
      vps_user:
        required: true
        type: string
      vps_port:
        required: true
        type: string
      vps_app_port:
        required: true
        type: string
      cloudflare_zone_id:
        required: true
        type: string
      api_domain:
        required: false
        type: string
        default: api.hoa.moe
      origin_domain:
        required: false
        type: string
        default: hoa.moe
      container_name:
        required: false
        type: string
        default: hoa-api

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hoa-api

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dns:
    name: 配置 Cloudflare DNS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 读取源站 IP 并写入 api 子域
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ inputs.cloudflare_zone_id }}
          API_DOMAIN: ${{ inputs.api_domain }}
          ORIGIN_DOMAIN: ${{ inputs.origin_domain }}
        run: |
          set -euo pipefail
          api() {
            curl -fsS -H "Authorization: Bearer ${CF_TOKEN}" \
                 -H "Content-Type: application/json" "$@"
          }

          # 从已有站点记录推导源站公网 IP
          ORIGIN_IP="$(api "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${ORIGIN_DOMAIN}" \
            | python3 -c '
          import json,sys
          d = json.load(sys.stdin)
          for r in d.get("result", []):
              if r.get("type") in ("A", "AAAA") and r.get("content"):
                  print(r["content"]); break
          ')"
          if [ -z "${ORIGIN_IP}" ]; then
            echo "::error::未能从 ${ORIGIN_DOMAIN} 推导源站 IP，请检查 Cloudflare 记录"
            exit 1
          fi
          echo "源站 IP: ${ORIGIN_IP}"

          # 已有记录则更新，否则创建
          EXISTING="$(api "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${API_DOMAIN}" \
            | python3 -c '
          import json,sys
          d = json.load(sys.stdin)
          for r in d.get("result", []):
              if r.get("type") == "A": print(r["id"]); break
          ')"
          if [ -n "${EXISTING}" ]; then
            echo "更新已有记录 ${EXISTING}"
            api -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${EXISTING}" \
              -d "{\"type\":\"A\",\"name\":\"${API_DOMAIN}\",\"content\":\"${ORIGIN_IP}\",\"proxied\":true,\"ttl\":1}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("  更新成功" if d.get("success") else d)'
          else
            echo "创建新记录 ${API_DOMAIN} -> ${ORIGIN_IP}"
            api -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -d "{\"type\":\"A\",\"name\":\"${API_DOMAIN}\",\"content\":\"${ORIGIN_IP}\",\"proxied\":true,\"ttl\":1}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("  创建成功" if d.get("success") else d)'
          fi

  deploy:
    name: 部署到官方 VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 加入组织 Tailscale 网络
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: 拉取镜像并启动容器
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_TOKEN_FOR_SYNC: ${{ secrets.FUMA_GITHUB_API_TOKEN }}
        with:
          host: ${{ inputs.vps_host }}
          username: ${{ inputs.vps_user }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ inputs.vps_port }}
          envs: GHCR_TOKEN,GITHUB_TOKEN_FOR_SYNC
          script: |
            set -euo pipefail
            image_ref='${{ needs.build.outputs.image_ref }}'
            container='${{ inputs.container_name }}'
            domain='${{ inputs.api_domain }}'
            app_port='${{ inputs.vps_app_port }}'

            echo "=== 反代环境探测 ==="
            docker ps --format '{{.Names}}' | sed 's/^/  容器: /' || true
            if docker network inspect proxy >/dev/null 2>&1; then
              echo "  proxy 网络存在"
            else
              echo "::error::找不到 proxy 网络"
              exit 1
            fi

            echo "=== 拉取镜像 ==="
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull "${image_ref}"

            echo "=== 启动容器 ==="
            docker volume create hoa-api-data >/dev/null
            docker rm -f "${container}" 2>/dev/null || true
            docker run -d \
              --name "${container}" \
              --network proxy \
              --restart unless-stopped \
              -p "${app_port}:8099" \
              -v hoa-api-data:/app/data \
              -e GITHUB_TOKEN="${GITHUB_TOKEN_FOR_SYNC}" \
              -e HOA_DB_PATH=/app/data/hoa.db \
              -e HOA_SITE_ORIGIN=https://hoa.moe \
              -e HOA_SYNC_INTERVAL_SEC=21600 \
              -e HOA_RATE_LIMIT_PER_MIN=120 \
              -e HOA_MCP_ALLOWED_HOSTS="localhost,127.0.0.1,[::1],${domain}" \
              -e VIRTUAL_HOST="${domain}" \
              -e VIRTUAL_PORT=8099 \
              -l "traefik.enable=true" \
              -l "traefik.http.routers.${container}.rule=Host(\`${domain}\`)" \
              -l "traefik.http.routers.${container}.entrypoints=websecure" \
              -l "traefik.http.routers.${container}.tls=true" \
              -l "traefik.http.services.${container}.loadbalancer.server.port=8099" \
              "${image_ref}"

            echo "=== 健康检查 ==="
            for _ in $(seq 1 30); do
              if docker exec "${container}" python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/api/v1/meta', timeout=4).status==200 else 1)"; then
                echo "  容器健康"
                break
              fi
              sleep 2
            done
            docker ps --filter "name=${container}" --format '  {{.Names}} {{.Status}} {{.Ports}}'
            docker logs --tail 30 "${container}" 2>&1 | sed 's/^/  /' || true

  verify:
    name: 外网验证
    needs: [dns, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: 轮询公开地址
        env:
          DOMAIN: ${{ inputs.api_domain }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${DOMAIN}/api/v1/meta" || true)"
            echo "  第 ${i} 次: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              echo "::notice::公开地址已就绪 https://${DOMAIN}/api/v1"
              exit 0
            fi
            sleep 10
          done
          echo "::error::公开地址未在预期时间内就绪"
          exit 1
