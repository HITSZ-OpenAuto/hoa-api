name: Inspect VPS

# 只读诊断工作流：通过 Tailscale + SSH 进入官方 VPS，
# 把反向代理（Traefik）的真实拓扑、compose 文件与路由配置全部 dump 到日志。
# 仅诊断，不做任何写操作。

on:
  workflow_call:
    inputs:
      vps_host:
        required: true
        type: string
      vps_user:
        required: true
        type: string
      vps_port:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      vps_host:
        required: true
        type: string
      vps_user:
        required: true
        type: string
      vps_port:
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: 探测 VPS 拓扑
    runs-on: ubuntu-latest
    steps:
      - name: 加入组织 Tailscale 网络
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: 转储容器、网络与代理配置
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ inputs.vps_host }}
          username: ${{ inputs.vps_user }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ inputs.vps_port }}
          script: |
            #!/usr/bin/env bash
            set -eo pipefail

            echo "############ 0. 主机 ############"
            echo "whoami=$(whoami) shell=${SHELL:-?}"
            uname -a
            if sudo -n true 2>/dev/null; then
              echo "SUDO_NOPASSWD=yes"
            else
              echo "SUDO_NOPASSWD=no"
            fi

            echo "############ 1. 容器 ############"
            docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}' 2>&1

            echo "############ 2. 网络 ############"
            docker network ls 2>&1
            for n in $(docker network ls -q 2>/dev/null); do
              echo "--- network $(docker network inspect --format '{{.Name}}' "$n" 2>/dev/null) ---"
              docker network inspect --format '{{range $k,$v := .Containers}}{{$v.Name}} {{end}}' "$n" 2>&1 || true
            done

            echo "############ 3. Traefik 容器 ############"
            TR="$(docker ps --format '{{.Names}}' 2>/dev/null | grep -i traefik | head -1)"
            echo "TRAEFIK_CONTAINER=${TR:-<none>}"
            if [ -n "${TR}" ]; then
              docker inspect "$TR" --format 'Cmd: {{json .Config.Cmd}}' 2>&1
              docker inspect "$TR" --format 'Entrypoint: {{json .Config.Entrypoint}}' 2>&1
              docker inspect "$TR" --format 'Env: {{json .Config.Env}}' 2>&1
              docker inspect "$TR" --format 'Labels: {{json .Config.Labels}}' 2>&1
              docker inspect "$TR" --format 'Mounts: {{json .Mounts}}' 2>&1
              docker inspect "$TR" --format 'Ports: {{json .HostConfig.PortBindings}}' 2>&1
              docker inspect "$TR" --format 'Networks: {{json .NetworkSettings.Networks}}' 2>&1
            fi

            echo "############ 4. hoa-fuma 容器 ############"
            docker inspect hoa-fuma --format 'Labels: {{json .Config.Labels}}' 2>&1
            docker inspect hoa-fuma --format 'Networks: {{json .NetworkSettings.Networks}}' 2>&1
            docker inspect hoa-fuma --format 'Ports: {{json .HostConfig.PortBindings}}' 2>&1
            docker inspect hoa-fuma --format 'Mounts: {{json .Mounts}}' 2>&1

            echo "############ 5. /home/kowyo 目录结构 ############"
            ls -la /home/kowyo 2>&1 | head -40
            echo "--- traefik-compose ---"
            ls -la /home/kowyo/traefik-compose 2>&1 | head -40

            echo "############ 6. Traefik 动态路由文件（核心）############"
            echo "--- dynamic 目录列表 ---"
            ls -la /home/kowyo/traefik-compose/dynamic 2>&1 | head -40
            for f in /home/kowyo/traefik-compose/dynamic/*; do
              [ -f "$f" ] || continue
              echo ">>> 文件 ${f}"
              cat "$f" 2>&1 | head -150 || true
            done

            echo "############ 6b. compose.yaml ############"
            cat /home/kowyo/traefik-compose/compose.yaml 2>&1 | head -150 || true

            echo "############ 6c. acme.json 摘要 ############"
            ls -la /home/kowyo/traefik-compose/letsencrypt 2>&1 | head -10 || true
            python3 - <<'PYEOF' 2>&1 | head -20 || true
            import json
            try:
                d = json.load(open("/home/kowyo/traefik-compose/letsencrypt/acme.json"))
            except Exception as e:
                print("无法读取 acme.json:", e); raise SystemExit
            certs = d.get("Certificates") or {}
            if not certs:
                print("Certificates 为空（Traefik 未通过 le 签发过证书）")
            for resolver, items in certs.items():
                for c in items:
                    print(resolver, "|", (c.get("domain") or {}).get("main"))
            PYEOF

            echo "############ 7. cloudflared 链路 ############"
            ps aux 2>&1 | grep -i "[c]loudflared" | head -10 || true
            echo "--- systemd unit ---"
            systemctl cat cloudflared.service 2>&1 | head -40 || true
            echo "--- ~/.cloudflared ---"
            ls -la /home/kowyo/.cloudflared 2>&1 | head -20 || true
            echo "--- /etc/cloudflared ---"
            ls -la /etc/cloudflared 2>&1 | head -20 || true
            for f in /etc/cloudflared/config.yml /etc/cloudflared/config.yaml /home/kowyo/.cloudflared/config.yml /home/kowyo/.cloudflared/config.yaml; do
              if [ -f "$f" ]; then
                echo ">>> 配置 ${f}"
                cat "$f" 2>&1 | head -60 || true
              fi
            done

            echo "############ 8. 实际链路探测 ############"
            echo "--- 公网 https://hoa.moe 响应头 ---"
            curl -sSI --max-time 12 https://hoa.moe/ 2>&1 | head -25 || true
            echo "--- 公网 https://stats.hoa.moe 响应头 ---"
            curl -sSI --max-time 12 https://stats.hoa.moe/ 2>&1 | head -25 || true
            echo "--- 本机 Traefik web(80) + Host: hoa.moe ---"
            curl -sSI --max-time 8 -H 'Host: hoa.moe' http://127.0.0.1:80/ 2>&1 | head -15 || true
            echo "--- 本机 Traefik web(80) + Host: stats.hoa.moe（已知可用路由）---"
            curl -sSI --max-time 8 -H 'Host: stats.hoa.moe' http://127.0.0.1:80/ 2>&1 | head -15 || true
            echo "--- 本机 hoa-fuma 直连 19800 ---"
            curl -sSI --max-time 8 http://127.0.0.1:19800/ 2>&1 | head -15 || true

            echo "############ 9. Traefik 日志（最近路由匹配）############"
            docker logs --tail 120 traefik-compose-traefik-1 2>&1 | tail -60 || true

            echo "############ 10. 运行中的服务 ############"
            systemctl list-units --type=service --state=running --no-pager 2>&1 | head -30 || true
